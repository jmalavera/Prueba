<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10251e" />
    <title>La culebrita</title>
    <style>
      :root {
        color-scheme: dark;
        --fondo: #10251e;
        --panel: #19372c;
        --verde: #a7f36b;
        --texto: #f3f7ef;
        --suave: #b7c8bc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background:
          radial-gradient(ellipse at top, #244b38 0%, transparent 55%),
          var(--fondo);
        color: var(--texto);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      .juego {
        width: min(100%, 520px);
        padding: 28px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        background: rgba(25, 55, 44, 0.94);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.3);
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.7rem, 6vw, 2.3rem);
        letter-spacing: -0.04em;
      }

      .subtitulo {
        margin: 5px 0 0;
        color: var(--suave);
        font-size: 0.95rem;
      }

      .marcador {
        min-width: 82px;
        padding: 9px 12px;
        border-radius: 14px;
        background: #10251e;
        text-align: center;
      }

      .marcador span {
        display: block;
        color: var(--suave);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .marcador strong {
        color: var(--verde);
        font-size: 1.4rem;
      }

      .tablero-marco {
        position: relative;
        overflow: hidden;
        border: 2px solid rgba(167, 243, 107, 0.35);
        border-radius: 16px;
        background: #122a21;
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 1;
        touch-action: none;
      }

      .mensaje {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        padding: 20px;
        background: rgba(12, 31, 23, 0.78);
        text-align: center;
      }

      .mensaje[hidden] {
        display: none;
      }

      .mensaje strong {
        font-size: 1.4rem;
      }

      .mensaje span {
        margin-top: 6px;
        color: var(--suave);
      }

      .acciones {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }

      button {
        min-height: 46px;
        border: 0;
        border-radius: 12px;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
        touch-action: manipulation;
      }

      button:focus-visible {
        outline: 3px solid white;
        outline-offset: 3px;
      }

      .accion {
        flex: 1;
        background: var(--verde);
        color: #14251b;
      }

      .secundario {
        padding: 0 16px;
        background: #2a4b3b;
        color: var(--texto);
      }

      .ayuda {
        margin: 16px 0 0;
        color: var(--suave);
        font-size: 0.88rem;
        line-height: 1.5;
        text-align: center;
      }

      .controles {
        display: grid;
        grid-template-columns: repeat(3, 54px);
        grid-template-rows: repeat(2, 48px);
        justify-content: center;
        gap: 7px;
        margin: 18px auto 0;
      }

      .direccion {
        background: #2a4b3b;
        color: var(--texto);
        font-size: 1.2rem;
      }

      .arriba { grid-column: 2; grid-row: 1; }
      .izquierda { grid-column: 1; grid-row: 2; }
      .abajo { grid-column: 2; grid-row: 2; }
      .derecha { grid-column: 3; grid-row: 2; }

      @media (max-width: 420px) {
        .juego {
          padding: 20px 16px;
        }

        header {
          align-items: flex-start;
        }

        .secundario {
          padding: 0 12px;
        }
      }
    </style>
  </head>
  <body>
    <main class="juego">
      <header>
        <div>
          <h1>La culebrita 🐍</h1>
          <p class="subtitulo">¡Come las manzanas y crece!</p>
        </div>
        <div class="marcador" aria-live="polite">
          <span>Puntos</span>
          <strong id="puntos">0</strong>
        </div>
      </header>

      <div class="tablero-marco">
        <canvas id="tablero" width="400" height="400" aria-label="Tablero del juego de la culebrita"></canvas>
        <div class="mensaje" id="mensaje">
          <strong id="titulo-mensaje">¿Listo para jugar?</strong>
          <span id="texto-mensaje">Presiona «Empezar» para comenzar.</span>
        </div>
      </div>

      <div class="acciones">
        <button class="accion" id="boton-empezar" type="button">Empezar</button>
        <button class="secundario" id="boton-pausa" type="button" disabled>Pausar</button>
      </div>

      <div class="controles" aria-label="Controles de dirección">
        <button class="direccion arriba" type="button" data-direccion="arriba" aria-label="Arriba">▲</button>
        <button class="direccion izquierda" type="button" data-direccion="izquierda" aria-label="Izquierda">◀</button>
        <button class="direccion abajo" type="button" data-direccion="abajo" aria-label="Abajo">▼</button>
        <button class="direccion derecha" type="button" data-direccion="derecha" aria-label="Derecha">▶</button>
      </div>

      <p class="ayuda">Usa las flechas del teclado o W, A, S, D. En el móvil, toca los botones.</p>
    </main>

    <script>
      const canvas = document.querySelector("#tablero");
      const ctx = canvas.getContext("2d");
      const puntosElemento = document.querySelector("#puntos");
      const mensaje = document.querySelector("#mensaje");
      const tituloMensaje = document.querySelector("#titulo-mensaje");
      const textoMensaje = document.querySelector("#texto-mensaje");
      const botonEmpezar = document.querySelector("#boton-empezar");
      const botonPausa = document.querySelector("#boton-pausa");

      const cantidad = 20;
      const celda = canvas.width / cantidad;
      const direcciones = {
        arriba: { x: 0, y: -1 },
        abajo: { x: 0, y: 1 },
        izquierda: { x: -1, y: 0 },
        derecha: { x: 1, y: 0 },
      };

      let serpiente;
      let comida;
      let direccion;
      let direccionSiguiente;
      let puntos = 0;
      let estado = "inactivo";
      let temporizador;

      function dibujarTablero() {
        ctx.fillStyle = "#122a21";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.045)";
        ctx.lineWidth = 1;

        for (let i = 1; i < cantidad; i += 1) {
          const posicion = i * celda;
          ctx.beginPath();
          ctx.moveTo(posicion, 0);
          ctx.lineTo(posicion, canvas.height);
          ctx.moveTo(0, posicion);
          ctx.lineTo(canvas.width, posicion);
          ctx.stroke();
        }

        if (!serpiente) return;

        serpiente.forEach((segmento, indice) => {
          const margen = 2;
          const x = segmento.x * celda + margen;
          const y = segmento.y * celda + margen;
          ctx.fillStyle = indice === 0 ? "#c4ff91" : "#83d950";
          ctx.beginPath();
          ctx.roundRect(x, y, celda - margen * 2, celda - margen * 2, 5);
          ctx.fill();

          if (indice === 0) {
            ctx.fillStyle = "#17321f";
            ctx.beginPath();
            ctx.arc(x + 5, y + 6, 1.5, 0, Math.PI * 2);
            ctx.arc(x + 12, y + 6, 1.5, 0, Math.PI * 2);
            ctx.fill();
          }
        });

        if (comida) {
          ctx.font = `${celda * 0.8}px system-ui`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("🍎", comida.x * celda + celda / 2, comida.y * celda + celda / 2 + 1);
        }
      }

      function colocarComida() {
        const libres = [];
        for (let y = 0; y < cantidad; y += 1) {
          for (let x = 0; x < cantidad; x += 1) {
            if (!serpiente.some((parte) => parte.x === x && parte.y === y)) {
              libres.push({ x, y });
            }
          }
        }
        comida = libres.length ? libres[Math.floor(Math.random() * libres.length)] : null;
      }

      function mostrarMensaje(titulo, texto) {
        tituloMensaje.textContent = titulo;
        textoMensaje.textContent = texto;
        mensaje.hidden = false;
      }

      function empezar() {
        clearInterval(temporizador);
        serpiente = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
        direccion = direcciones.derecha;
        direccionSiguiente = direccion;
        puntos = 0;
        puntosElemento.textContent = puntos;
        colocarComida();
        estado = "jugando";
        mensaje.hidden = true;
        botonEmpezar.textContent = "Reiniciar";
        botonPausa.disabled = false;
        botonPausa.textContent = "Pausar";
        dibujarTablero();
        temporizador = setInterval(avanzar, 125);
      }

      function avanzar() {
        direccion = direccionSiguiente;
        const cabeza = {
          x: serpiente[0].x + direccion.x,
          y: serpiente[0].y + direccion.y,
        };
        const comio = comida && cabeza.x === comida.x && cabeza.y === comida.y;
        const cuerpo = comio ? serpiente : serpiente.slice(0, -1);
        const choco = cabeza.x < 0 || cabeza.x >= cantidad ||
          cabeza.y < 0 || cabeza.y >= cantidad ||
          cuerpo.some((parte) => parte.x === cabeza.x && parte.y === cabeza.y);

        if (choco) {
          terminar();
          return;
        }

        serpiente.unshift(cabeza);
        if (comio) {
          puntos += 1;
          puntosElemento.textContent = puntos;
          colocarComida();
          if (!comida) {
            terminar("¡Ganaste!", "Llenaste todo el tablero. ¡Increíble!");
            return;
          }
        } else {
          serpiente.pop();
        }
        dibujarTablero();
      }

      function terminar(titulo = "¡Fin del juego!", texto = `Conseguiste ${puntos} ${puntos === 1 ? "punto" : "puntos"}. Presiona «Jugar otra vez».`) {
        clearInterval(temporizador);
        estado = "terminado";
        botonPausa.disabled = true;
        mostrarMensaje(titulo, texto);
      }

      function pausar() {
        if (estado === "jugando") {
          clearInterval(temporizador);
          estado = "pausado";
          botonPausa.textContent = "Continuar";
          mostrarMensaje("Juego en pausa", "Presiona «Continuar» cuando quieras seguir.");
        } else if (estado === "pausado") {
          estado = "jugando";
          mensaje.hidden = true;
          botonPausa.textContent = "Pausar";
          temporizador = setInterval(avanzar, 125);
        }
      }

      function cambiarDireccion(nombre) {
        if (estado !== "jugando") return;
        const nueva = direcciones[nombre];
        if (!nueva || (nueva.x + direccion.x === 0 && nueva.y + direccion.y === 0)) return;
        direccionSiguiente = nueva;
      }

      const teclas = {
        ArrowUp: "arriba", w: "arriba", W: "arriba",
        ArrowDown: "abajo", s: "abajo", S: "abajo",
        ArrowLeft: "izquierda", a: "izquierda", A: "izquierda",
        ArrowRight: "derecha", d: "derecha", D: "derecha",
      };

      document.addEventListener("keydown", (evento) => {
        if (teclas[evento.key]) {
          evento.preventDefault();
          cambiarDireccion(teclas[evento.key]);
        } else if (evento.key === " " && estado === "jugando") {
          evento.preventDefault();
          pausar();
        }
      });

      document.querySelectorAll("[data-direccion]").forEach((boton) => {
        boton.addEventListener("click", () => cambiarDireccion(boton.dataset.direccion));
      });

      botonEmpezar.addEventListener("click", empezar);
      botonPausa.addEventListener("click", pausar);
      dibujarTablero();
    </script>
  </body>
</html>
